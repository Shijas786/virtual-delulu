<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puppet Theater</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        color: #ccc;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      #video {
        position: fixed;
        top: 12px;
        left: 12px;
        width: 200px;
        height: auto;
        transform: scaleX(-1);
        border: 1px solid #222;
        border-radius: 4px;
        pointer-events: none;
        z-index: 1;
      }
      #landmark-canvas {
        position: fixed;
        top: 12px;
        left: 12px;
        width: 200px;
        height: auto;
        border: 1px solid #222;
        border-radius: 4px;
        pointer-events: none;
        z-index: 2;
      }
      #scene {
        display: block;
        width: 100vw;
        height: 100vh;
        position: relative;
        z-index: 3;
      }

      /* Debug-mode visibility cycle, driven by body[data-debug]:
         "camera"          — full-screen webcam, nothing else
         "camera-markers"  — full-screen webcam + landmark overlay
         "camera-puppet"   — full-screen webcam + puppets (no theater)
         (no attribute)    — normal mode */
      body[data-debug^="camera"] #video {
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        border: 0;
        border-radius: 0;
        z-index: 0;
      }
      body[data-debug="camera-markers"] #landmark-canvas {
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        border: 0;
        border-radius: 0;
      }
      body[data-debug="camera"] #landmark-canvas,
      body[data-debug="camera-puppet"] #landmark-canvas {
        display: none;
      }
      body[data-debug="camera"] #scene,
      body[data-debug="camera-markers"] #scene {
        display: none;
      }
      body[data-debug="camera-puppet"] #scene {
        background: transparent;
      }

      /* ---------- Landing ---------- */
      #landing {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #15141a 0%, #050507 70%);
        transition: opacity 0.4s ease-out;
      }
      #landing.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .landing-card {
        width: min(560px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        padding: 28px 32px 24px;
        background: #0e0d12;
        border: 1px solid #2a2731;
        border-radius: 10px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      }
      .landing-title {
        font-size: 20px;
        letter-spacing: 0.5px;
        color: #e8e3d8;
        margin: 0 0 4px;
      }
      .landing-sub {
        font-size: 12px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #7c7388;
        margin: 0 0 20px;
      }
      .landing-section {
        margin-bottom: 18px;
      }
      .landing-section h3 {
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #b8a48a;
        margin: 0 0 8px;
        font-weight: 600;
      }
      #landing-camera-preview {
        width: 100%;
        max-width: 220px;
        aspect-ratio: 4 / 3;
        background: #060509;
        border: 1px solid #2a2731;
        border-radius: 6px;
        transform: scaleX(-1);
        object-fit: cover;
        display: block;
      }
      #landing-stt-text {
        width: 100%;
        height: 60px;
        background: #060509;
        color: #d8cfe2;
        border: 1px solid #2a2731;
        border-radius: 6px;
        padding: 8px 10px;
        font: inherit;
        font-size: 13px;
        resize: none;
        box-sizing: border-box;
      }
      .landing-row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .status {
        font-size: 12px;
        margin-top: 6px;
        line-height: 1.4;
      }
      .status.pending { color: #8d839b; }
      .status.ok      { color: #7fb3a0; }
      .status.warn    { color: #d4a85a; }
      .status.err     { color: #d8745f; }
      button.landing-btn,
      select.landing-select {
        background: #1c1924;
        color: #e8e3d8;
        border: 1px solid #38323f;
        border-radius: 6px;
        padding: 7px 14px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }
      button.landing-btn:hover:not(:disabled),
      select.landing-select:hover {
        background: #26222e;
        border-color: #4a424f;
      }
      button.landing-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      #landing-start {
        display: block;
        width: 100%;
        margin-top: 12px;
        padding: 12px 18px;
        font-size: 14px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        background: linear-gradient(90deg, #d98b4f, #7fb3a0);
        color: #0a0a0c;
        border: 0;
        font-weight: 600;
        cursor: pointer;
      }
      #landing-start:hover:not(:disabled) {
        filter: brightness(1.08);
      }
      .brain-row {
        display: flex;
        gap: 8px;
      }
      .brain-pill {
        flex: 1;
        background: #1c1924;
        color: #e8e3d8;
        border: 1px solid #38323f;
        border-radius: 6px;
        padding: 9px 12px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        text-align: left;
        line-height: 1.35;
        transition: background 0.15s, border-color 0.15s;
      }
      .brain-pill:hover {
        background: #26222e;
        border-color: #4a424f;
      }
      .brain-pill.active {
        border-color: #d98b4f;
        background: #2a1f1c;
      }
      .brain-pill-title {
        display: block;
        font-weight: 600;
        color: #f1d8b8;
      }
      .brain-pill-sub {
        display: block;
        font-size: 10px;
        color: #8d839b;
        margin-top: 2px;
      }
      .brain-pill.active .brain-pill-sub {
        color: #b8a48a;
      }

      /* ---------- HUD ---------- */
      #hud {
        position: fixed;
        bottom: 12px;
        right: 12px;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        pointer-events: none;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      .hud-bar {
        display: flex;
        gap: 12px;
        padding: 6px 10px;
        background: rgba(10, 9, 14, 0.7);
        border: 1px solid #2a2731;
        border-radius: 6px;
        font-size: 10px;
        letter-spacing: 1.5px;
        color: #b8a48a;
        backdrop-filter: blur(6px);
      }
      .hud-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .hud-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4a424f;
        transition: background 0.2s, box-shadow 0.2s;
      }
      .hud-dot[data-status="ok"] {
        background: #7fb3a0;
        box-shadow: 0 0 6px rgba(127, 179, 160, 0.6);
      }
      .hud-dot[data-status="warn"] {
        background: #d4a85a;
        box-shadow: 0 0 6px rgba(212, 168, 90, 0.6);
      }
      .hud-dot[data-status="err"] {
        background: #d8745f;
        box-shadow: 0 0 6px rgba(216, 116, 95, 0.6);
      }
      .hud-banner {
        padding: 6px 12px;
        background: rgba(60, 30, 12, 0.85);
        border: 1px solid #6a4020;
        border-radius: 6px;
        font-size: 11px;
        letter-spacing: 0.5px;
        color: #f1d8b8;
        max-width: 280px;
      }
      .hud-banner[hidden] {
        display: none;
      }
      .hud-toasts {
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: flex-end;
      }
      .hud-toast {
        padding: 7px 12px;
        background: rgba(20, 18, 26, 0.92);
        border: 1px solid #38323f;
        border-radius: 6px;
        font-size: 12px;
        color: #e8e3d8;
        max-width: 280px;
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 0.25s, transform 0.25s;
      }
      .hud-toast.show {
        opacity: 1;
        transform: translateY(0);
      }
      .hud-stt {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        background: rgba(10, 9, 14, 0.7);
        border: 1px solid #2a2731;
        border-radius: 6px;
        font-size: 11px;
        color: #b8a48a;
        backdrop-filter: blur(6px);
        max-width: 360px;
      }
      .hud-stt[data-state="listening"] { border-color: #3a5a4f; }
      .hud-stt[data-state="hearing"] {
        border-color: #7fb3a0;
        box-shadow: 0 0 10px rgba(127, 179, 160, 0.3);
      }
      .hud-stt[data-state="denied"],
      .hud-stt[data-state="error"],
      .hud-stt[data-state="unsupported"] {
        border-color: #6a3a32;
        color: #d8a89a;
      }
      .hud-stt-text {
        color: #e8e3d8;
        font-style: italic;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 240px;
      }
      .hud-stt-text[data-final="true"] {
        color: #f1d8b8;
        font-style: normal;
      }
      .hud-dreaming {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        background: linear-gradient(135deg, rgba(63, 31, 91, 0.85), rgba(31, 18, 50, 0.85));
        border: 1px solid #6a4a8e;
        border-radius: 6px;
        font-size: 11px;
        letter-spacing: 0.5px;
        color: #e8d8f5;
        box-shadow: 0 0 16px rgba(150, 100, 220, 0.25);
        animation: hud-dreaming-pulse 1.6s ease-in-out infinite;
      }
      .hud-dreaming[hidden] {
        display: none;
      }
      .hud-dreaming-icon {
        display: inline-block;
        animation: hud-dreaming-spin 4s linear infinite;
      }
      @keyframes hud-dreaming-pulse {
        0%, 100% { box-shadow: 0 0 12px rgba(150, 100, 220, 0.2); }
        50% { box-shadow: 0 0 24px rgba(180, 130, 240, 0.45); }
      }
      @keyframes hud-dreaming-spin {
        0%, 100% { transform: rotate(-6deg) scale(1); }
        50% { transform: rotate(6deg) scale(1.15); }
      }

      /* ---------- Stage Chat & Prompt Chips ---------- */
      #stage-chat {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        width: min(640px, calc(100vw - 32px));
        pointer-events: auto;
      }
      .stage-chat-chips {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
      }
      .stage-chip {
        background: rgba(27, 22, 34, 0.78);
        border: 1px solid rgba(210, 173, 103, 0.3);
        color: #f1e3d3;
        border-radius: 16px;
        padding: 4px 10px;
        font-size: 11px;
        font-family: inherit;
        cursor: pointer;
        backdrop-filter: blur(8px);
        transition: all 0.2s ease;
      }
      .stage-chip:hover {
        background: rgba(45, 33, 56, 0.9);
        border-color: #d2ad67;
        color: #fff;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(210, 173, 103, 0.2);
      }
      .stage-chip-shuffle {
        background: rgba(255, 215, 0, 0.15);
        border-color: #ffd166;
        color: #ffe66d;
        font-weight: 700;
      }
      .stage-chip-shuffle:hover {
        background: rgba(255, 215, 0, 0.3);
        transform: translateY(-2px) scale(1.08) rotate(6deg);
        box-shadow: 0 4px 14px rgba(255, 209, 102, 0.4);
      }
      .stage-chat-bar {
        width: 100%;
        display: flex;
        align-items: center;
        background: rgba(18, 14, 24, 0.88);
        border: 1px solid rgba(210, 173, 103, 0.35);
        border-radius: 24px;
        padding: 4px 6px 4px 16px;
        backdrop-filter: blur(12px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
      .stage-chat-input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: #fff7e8;
        font-size: 13px;
        font-family: inherit;
      }
      .stage-chat-input::placeholder {
        color: rgba(220, 205, 225, 0.5);
      }
      .stage-chat-submit {
        background: linear-gradient(135deg, #d98b4f, #7fb3a0);
        border: none;
        outline: none;
        color: #1a1220;
        font-weight: 600;
        font-size: 12px;
        border-radius: 18px;
        padding: 7px 14px;
        cursor: pointer;
        transition: filter 0.15s, transform 0.15s;
      }
      .stage-chat-submit:hover {
        filter: brightness(1.1);
        transform: scale(1.03);
      }

      /* ---------- Kids-Friendly Themes & Switcher ---------- */
      .theme-switcher-bar {
        position: fixed;
        top: 14px;
        right: 16px;
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(18, 14, 24, 0.88);
        border: 2px solid rgba(210, 173, 103, 0.4);
        padding: 5px 10px;
        border-radius: 30px;
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        transition: all 0.3s ease;
      }
      .theme-switcher-label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.5px;
        color: #ffca3a;
        text-transform: uppercase;
        user-select: none;
      }
      .theme-buttons {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .theme-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 6px 12px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.06);
        color: #e8e3d8;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .theme-btn:hover {
        transform: translateY(-2px) scale(1.05);
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
      }
      .theme-btn.active {
        background: linear-gradient(135deg, #d90429, #f77f00);
        border-color: #ffd166;
        color: #fff;
        box-shadow: 0 0 14px rgba(247, 127, 0, 0.5);
        transform: scale(1.05);
      }
      .theme-icon {
        font-size: 14px;
      }

      /* World Picker Row on Landing Card */
      .theme-world-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 6px;
      }
      .theme-world-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px 6px;
        background: rgba(255, 255, 255, 0.04);
        border: 2px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        cursor: pointer;
        text-align: center;
        transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
        color: #e8e3d8;
      }
      .theme-world-card:hover {
        transform: translateY(-2px) scale(1.03);
        border-color: rgba(255, 255, 255, 0.35);
        background: rgba(255, 255, 255, 0.08);
      }
      .theme-world-emoji {
        font-size: 26px;
        margin-bottom: 4px;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
      }
      .theme-world-name {
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 2px;
      }
      .theme-world-sub {
        font-size: 10px;
        opacity: 0.7;
      }

      /* ===== Theme 1: 🎪 Circus Carnival ===== */
      body[data-theme="carnival"] .theme-switcher-bar {
        border-color: #d90429;
        box-shadow: 0 0 20px rgba(217, 4, 41, 0.35);
      }
      body[data-theme="carnival"] .landing-card {
        border-color: #f77f00;
        box-shadow: 0 0 35px rgba(247, 127, 0, 0.25);
      }
      body[data-theme="carnival"] .theme-world-card.active {
        border-color: #f77f00;
        background: linear-gradient(135deg, rgba(217, 4, 41, 0.25), rgba(247, 127, 0, 0.25));
        box-shadow: 0 0 16px rgba(247, 127, 0, 0.4);
      }
      body[data-theme="carnival"] #landing-start {
        background: linear-gradient(135deg, #d90429, #f77f00);
        color: #fff;
      }

      /* ===== Theme 2: 🚀 Cosmic Space Galaxy ===== */
      body[data-theme="space"] {
        --theme-accent: #00f5d4;
      }
      body[data-theme="space"] .theme-switcher-bar {
        border-color: #00f5d4;
        box-shadow: 0 0 24px rgba(0, 245, 212, 0.35);
        background: rgba(10, 8, 30, 0.9);
      }
      body[data-theme="space"] .theme-btn.active {
        background: linear-gradient(135deg, #7209b7, #00f5d4);
        border-color: #00f5d4;
        box-shadow: 0 0 16px rgba(0, 245, 212, 0.6);
      }
      body[data-theme="space"] .landing-card {
        border-color: #00f5d4;
        background: radial-gradient(circle at top, #140d33 0%, #060412 100%);
        box-shadow: 0 0 45px rgba(0, 245, 212, 0.25);
      }
      body[data-theme="space"] .landing-title {
        color: #00f5d4;
        text-shadow: 0 0 12px rgba(0, 245, 212, 0.5);
      }
      body[data-theme="space"] .theme-world-card.active {
        border-color: #00f5d4;
        background: linear-gradient(135deg, rgba(114, 9, 183, 0.3), rgba(0, 245, 212, 0.3));
        box-shadow: 0 0 20px rgba(0, 245, 212, 0.45);
      }
      body[data-theme="space"] #landing-start {
        background: linear-gradient(135deg, #7209b7, #00f5d4);
        color: #0a081e;
        font-weight: 800;
        box-shadow: 0 0 20px rgba(0, 245, 212, 0.4);
      }
      body[data-theme="space"] .stage-chip {
        border-color: rgba(0, 245, 212, 0.4);
        background: rgba(14, 11, 38, 0.85);
        color: #bbf2f6;
      }
      body[data-theme="space"] .stage-chat-bar {
        border-color: #00f5d4;
        box-shadow: 0 0 25px rgba(0, 245, 212, 0.2);
      }
      body[data-theme="space"] .stage-chat-submit {
        background: linear-gradient(135deg, #00f5d4, #7209b7);
        color: #0a081e;
      }

      /* ===== Theme 3: 🌈 Candy Rainbow ===== */
      body[data-theme="rainbow"] {
        --theme-accent: #ff6b8b;
      }
      body[data-theme="rainbow"] .theme-switcher-bar {
        border-color: #ff6b8b;
        box-shadow: 0 0 24px rgba(255, 107, 139, 0.35);
        background: rgba(28, 14, 25, 0.9);
      }
      body[data-theme="rainbow"] .theme-btn.active {
        background: linear-gradient(135deg, #ff6b8b, #ffd166);
        border-color: #ffb703;
        box-shadow: 0 0 16px rgba(255, 107, 139, 0.6);
        color: #1a0814;
      }
      body[data-theme="rainbow"] .landing-card {
        border-color: #ff6b8b;
        background: radial-gradient(circle at top, #2b1126 0%, #120610 100%);
        box-shadow: 0 0 45px rgba(255, 107, 139, 0.25);
      }
      body[data-theme="rainbow"] .landing-title {
        color: #ff8fab;
        text-shadow: 0 0 12px rgba(255, 143, 171, 0.5);
      }
      body[data-theme="rainbow"] .theme-world-card.active {
        border-color: #ff6b8b;
        background: linear-gradient(135deg, rgba(255, 107, 139, 0.35), rgba(255, 209, 102, 0.3));
        box-shadow: 0 0 20px rgba(255, 107, 139, 0.45);
      }
      body[data-theme="rainbow"] #landing-start {
        background: linear-gradient(135deg, #ff6b8b, #ffd166);
        color: #2b0c1e;
        font-weight: 800;
        box-shadow: 0 0 20px rgba(255, 107, 139, 0.4);
      }
      body[data-theme="rainbow"] .stage-chip {
        border-color: rgba(255, 107, 139, 0.4);
        background: rgba(35, 15, 30, 0.85);
        color: #ffe3ea;
      }
      body[data-theme="rainbow"] .stage-chat-bar {
        border-color: #ff6b8b;
        box-shadow: 0 0 25px rgba(255, 107, 139, 0.2);
      }
      body[data-theme="rainbow"] .stage-chat-submit {
        background: linear-gradient(135deg, #ff6b8b, #ffd166);
        color: #2b0c1e;
      }
    </style>
  </head>
  <body>
    <div id="landing">
      <div class="landing-card">
        <h1 class="landing-title">Virtual Puppet Theater</h1>
        <p class="landing-sub">Pre-flight check</p>

        <section class="landing-section">
          <h3>Camera</h3>
          <video id="landing-camera-preview" playsinline muted></video>
          <div id="landing-camera-status" class="status pending">Requesting camera…</div>
        </section>

        <section class="landing-section">
          <h3>Microphone</h3>
          <div id="landing-stt-status" class="status pending">Checking speech recognition…</div>
          <textarea
            id="landing-stt-text"
            readonly
            placeholder="Speak — what we hear appears here."
          ></textarea>
          <div id="landing-stt-trace" class="status pending" style="font-size: 10px; font-family: ui-monospace, monospace; min-height: 1em"></div>
          <div class="landing-row" style="margin-top: 8px">
            <button id="landing-stt-btn" class="landing-btn" type="button">Test microphone</button>
          </div>
        </section>

        <section class="landing-section">
          <h3>Voice</h3>
          <div class="landing-row">
            <button id="landing-tts-btn" class="landing-btn" type="button">Say hello</button>
            <select id="landing-voice-select" class="landing-select" aria-label="AI puppet voice">
              <option value="">Auto (AI picks)</option>
            </select>
          </div>
        </section>

        <section class="landing-section">
          <h3>Puppet brain</h3>
          <div class="brain-row" role="radiogroup" aria-label="Brain size">
            <button
              id="landing-brain-large"
              class="brain-pill active"
              type="button"
              role="radio"
              aria-checked="true"
            >
              <span class="brain-pill-title">Large brain</span>
              <span class="brain-pill-sub">Smarter but slower (GPT-6 Luna)</span>
            </button>
            <button
              id="landing-brain-small"
              class="brain-pill"
              type="button"
              role="radio"
              aria-checked="false"
            >
              <span class="brain-pill-title">Small brain</span>
              <span class="brain-pill-sub">Faster (GPT-4o-mini)</span>
            </button>
          </div>
        </section>

        <section class="landing-section">
          <h3>Choose Your World</h3>
          <div class="theme-world-row" role="radiogroup" aria-label="Interactive world theme">
            <button
              class="theme-world-card active"
              data-theme-pick="carnival"
              type="button"
            >
              <span class="theme-world-emoji">🎪</span>
              <span class="theme-world-name">Magic Circus</span>
              <span class="theme-world-sub">Classic toy theater</span>
            </button>
            <button
              class="theme-world-card"
              data-theme-pick="space"
              type="button"
            >
              <span class="theme-world-emoji">🚀</span>
              <span class="theme-world-name">Cosmic Space</span>
              <span class="theme-world-sub">Alien stars & rockets</span>
            </button>
            <button
              class="theme-world-card"
              data-theme-pick="rainbow"
              type="button"
            >
              <span class="theme-world-emoji">🌈</span>
              <span class="theme-world-name">Candy Rainbow</span>
              <span class="theme-world-sub">Pastel fairy dreamland</span>
            </button>
          </div>
        </section>

        <button id="landing-start" type="button" disabled>Start the show</button>
      </div>
    </div>

    <video id="video" playsinline></video>
    <canvas id="landmark-canvas"></canvas>
    <canvas id="scene"></canvas>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"
      integrity="sha384-oHwoZ9HyKv5ark5VOH+XWdbNfmhYtptAOBuV8plz6mAfXvTA6d8fULuYllWouEK2"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
